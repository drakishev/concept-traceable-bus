[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "concept-traceable-bus"
version = "1.0.0"
description = "Concept-traceable breast ultrasound report generation: code and results of the article"
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.10"
dependencies = [
    # Core deep learning
    "torch>=2.1.0",
    "torchvision>=0.16.0",
    # HuggingFace ecosystem
    "transformers>=4.47.0",
    "accelerate>=1.2.0",
    "peft>=0.14.0",
    "trl>=0.13.0",
    "datasets>=3.0.0",
    "huggingface-hub>=0.26.0",
    "safetensors>=0.4.0",
    "tokenizers>=0.21.0",
    # Vision
    "Pillow>=10.0.0",
    "opencv-python-headless>=4.8.0",
    "timm>=1.0.0",
    # Data / config
    "pandas>=2.0.0",
    "scikit-learn>=1.3.0",
    "omegaconf>=2.3.0",
    "tqdm",
    # Metrics
    "nltk>=3.8.0",
    "rouge-score>=0.1.2",
    "evaluate>=0.4.0",
    # Experiment tracking
    "wandb>=0.16.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
    "ruff>=0.1.0",
    "ipykernel",
]
# Download helpers (heavy, optional)
download = [
    "requests",
    "kaggle",
]
# Flash attention (install separately after torch, speeds up Qwen2-VL)
# pip install flash-attn --no-build-isolation

[tool.setuptools.packages.find]
where = ["."]
include = ["src*"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "W"]

[tool.pytest.ini_options]
testpaths = ["tests"]
