defaults:
  - model: ultrasound_jepa_biomedclip

train:
  stage: finetune
  output_dir: checkpoints/ultrasound_jepa_finetune_v5

  pretrain_checkpoint: null  # set per job by scripts/run_weekend7.py

  lr: 5.0e-5
  weight_decay: 0.01
  betas: [0.9, 0.95]
  warmup_steps: 100
  max_steps: -1
  min_lr_ratio: 0.01
  num_epochs: 10

  batch_size: 16
  num_workers: 4

  temperature: 0.07
  learnable_temperature: false

  precision: bf16-mixed
  gradient_clip_val: 1.0

  log_every_n_steps: 10
  val_check_interval: 1.0
  save_top_k: 3
  monitor: val/loss
  monitor_mode: min
  # Replayed on every batch-6 run: patience 3 keeps the same best epoch as the
  # full schedule in all of them (md_files/REVISION2_PLAN.md, batch 7).
  early_stop_patience: 3

  wandb_project: null
  run_name: ultrasound_jepa_finetune_v5

  # keep aux heads architecture present so checkpoint loads; they're frozen in stage 2
  aux_heads: [pathology, risk, birads]
  aux_loss_weight: 0.1

data:
  train_jsonl: data/augmented_v5/train.jsonl
  val_jsonl: data/augmented_v5/val.jsonl
  image_size: 224
  preprocess_mode: ultrasound
