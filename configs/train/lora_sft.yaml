defaults:
  - model: qwen2vl_7b
  - data: unified

train:
  output_dir: checkpoints/qwen2vl_lora
  # Learning rate
  lr: 2.0e-4
  lr_scheduler: cosine
  warmup_steps: 100
  weight_decay: 0.01
  # Batch size per GPU; effective = per_gpu * num_gpus * grad_accum
  per_device_train_batch_size: 4
  gradient_accumulation_steps: 4
  # Epochs / steps
  num_train_epochs: 3
  max_steps: -1   # -1 = run full epochs
  # Logging / saving
  logging_steps: 10
  eval_steps: 200
  save_steps: 200
  save_total_limit: 3
  # Precision
  bf16: true
  tf32: true
  # Gradient checkpointing saves VRAM at cost of ~20% speed
  gradient_checkpointing: true
  # Optimizer
  optim: adamw_torch_fused
  # WandB — set to wandb once you've run `wandb login`
  report_to: none
  run_name: qwen2vl_lora_bus
  # Resume
  resume_from_checkpoint: null   # set to checkpoint dir to resume
  # Packing: concatenate short samples for efficiency
  packing: false   # set true if most samples are short (<512 tokens)
  max_seq_length: 2048
