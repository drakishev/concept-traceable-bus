defaults:
  - model: report_model

train:
  stage: pretrain
  output_dir: checkpoints/report_model_stage1

  lr: 1.0e-4
  weight_decay: 0.05
  betas: [0.9, 0.95]
  warmup_steps: 200
  max_steps: -1
  min_lr_ratio: 0.01
  num_epochs: 20

  batch_size: 32
  num_workers: 4

  temperature: 0.07
  learnable_temperature: true

  precision: bf16-mixed
  gradient_clip_val: 1.0

  log_every_n_steps: 10
  val_check_interval: 1.0
  save_top_k: 3
  monitor: val/loss
  monitor_mode: min
  # Replayed on the logs of an earlier grouped split: patience 4 keeps the same best epoch as the
  # full schedule in all of them.
  early_stop_patience: 4

  wandb_project: null
  run_name: report_model_stage1

  # multi-task auxiliary heads on the Predictor
  aux_heads: [pathology, risk, birads]
  aux_loss_weight: 0.1

data:
  train_jsonl: data/split_augmented/train.jsonl
  val_jsonl: data/split_augmented/val.jsonl
  image_size: 224
  preprocess_mode: ultrasound
